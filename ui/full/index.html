<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apollo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- The ring shader from the brief, tinted and dimmed. Everything else sits
     on top of it; nothing else paints a background. -->
<canvas id="shader"></canvas>
<div class="vignette"></div>

<!-- LYLA's room is the whole window, the way it always was: her stations are
     laid out across its width and her floor sits 88px up from the bottom.
     The panels leave that band clear for her. -->
<canvas id="lyla"></canvas>

<div class="scanlines"></div>

<main id="stage">
  <header id="clock-block" class="rise">
    <div id="clock"><span id="hhmm">--:--</span><span id="seconds">:--</span></div>
    <div id="date" class="line">&nbsp;</div>
    <div id="date-extra" class="caption">&nbsp;</div>
    <div id="weather" class="caption">&nbsp;</div>
  </header>

  <aside id="status-block" class="rise">
    <div id="dots"></div>
    <div id="market-clock" class="caption">&nbsp;</div>
    <div id="note" class="note"></div>
  </aside>

  <section id="markets" class="panel rise">
    <h2 id="markets-head">Markets</h2>
    <div id="indices"></div>
    <div id="watchlist"></div>
  </section>

  <section id="headlines" class="panel rise">
    <h2 id="headlines-head">Headlines</h2>
    <div id="topics" class="chips"></div>
    <div id="stories"></div>
  </section>

  <section id="posts" class="panel rise">
    <h2 id="posts-head">Trump · Truth Social</h2>
    <div id="post-list"></div>
  </section>

  <section id="strip" class="panel rise">
    <div class="strip-item"><span class="tag">Tokens today</span><span id="tokens">—</span></div>
    <div class="strip-item"><span class="tag">System</span><span id="system">—</span></div>
    <div class="strip-item"><span class="tag">Clips</span><span id="clips">—</span></div>
    <div class="strip-item right"><span class="tag">Updated</span><span id="updated">—</span></div>
  </section>

  <section id="core">
    <canvas id="ring" width="520" height="520"></canvas>
    <div id="wordmark">APOLLO</div>
    <div id="hint" class="caption">Hold Ctrl+Alt to talk</div>
  </section>

  <section id="answer">
    <div id="you" class="you"></div>
    <div id="reply"></div>
    <div id="visual"></div>
  </section>

  <section id="lyla-block" class="rise">
    <canvas id="lyla-icon" width="48" height="72"></canvas>
    <div id="lyla-label" class="caption">LYLA // BOOTING</div>
    <div id="lyla-battery"><div id="lyla-bar"></div></div>
    <div id="lyla-pct" class="caption">88%</div>
  </section>
</main>

<!-- Under this page's own directory on purpose: pywebview roots its HTTP
     server at the page, so anything above it is unreachable at runtime. -->
<script src="vendor/motion.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
