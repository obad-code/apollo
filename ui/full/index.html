<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apollo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- The ground under everything: an old set's own pixels, a slot mask lit by
     drifting colour and seen through a fisheye (shader.js). Nothing else
     paints a background. -->
<canvas id="shader"></canvas>
<!-- The two washes under the stock curves, defined once: an id per card would
     be seven ids for two gradients. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="washUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe39a" stop-opacity=".26"/>
      <stop offset="1" stop-color="#5fe39a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="washDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b7a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff6b7a" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div class="vignette"></div>

<!-- LYLA's room is the whole window, the way it always was: her stations are
     laid out across its width and her floor sits 88px up from the bottom.
     The panels leave that band clear for her. -->
<canvas id="lyla"></canvas>

<div class="scanlines"></div>

<main id="stage">
  <!-- Every block that is a display in ultra mode says which one it is
       (data-display): there they are tiles you can move, resize, hide and
       expand, laid out by tiles.js. -->
  <header id="clock-block" class="rise" data-display="today">
    <div id="clock"><span id="hhmm">--:--</span><span id="seconds">:--</span></div>
    <div id="date" class="line">&nbsp;</div>
    <div id="date-extra" class="caption">&nbsp;</div>
    <div id="weather" class="caption">&nbsp;</div>
    <!-- The next prayer, and who on your list reports this week. -->
    <div id="today-line" class="caption"></div>
    <!-- Ultra mode only: the rest of the day - the next prayer, the
         market's hours, who reports this week, what is due. -->
    <div id="today-more" class="more"></div>
  </header>

  <!-- Under the stocks: the links to Gemini and Claude, the machine and the
       day's talking - small while LYLA's room is up, the full meters when
       it is away. -->
  <aside id="status-block" class="rise" data-display="system">
    <div id="dots"></div>
    <div id="market-clock" class="caption">&nbsp;</div>
    <!-- The machine and the day's talking, as an old set's meters: rows of
         lit segments rather than a strip of numbers. -->
    <div id="gauges">
      <div class="gauge" data-gauge="cpu"><span class="tag">CPU</span><i class="bar"></i><b>—</b></div>
      <div class="gauge" data-gauge="gpu"><span class="tag">GPU</span><i class="bar"></i><b>—</b></div>
      <div class="gauge" data-gauge="ram"><span class="tag">RAM</span><i class="bar"></i><b>—</b></div>
      <div id="gauge-foot" class="caption">&nbsp;</div>
    </div>
    <!-- The card, and each model's share of the day's talking. -->
    <div id="system-line" class="caption"></div>
    <!-- Ultra mode only: each model's share of the day, the machine's card,
         and how fresh every reading is. -->
    <div id="system-more" class="more"></div>
    <div id="note" class="note"></div>
  </aside>

  <section id="markets" class="panel rise" data-display="markets">
    <!-- The side panel's tabs: the stocks, your talks with Apollo, your
         projects, your ideas. -->
    <h2 id="panel-tabs">
      <span class="tab on" data-tab="stocks" id="markets-head">Markets</span>
      <span class="tab" data-tab="talks">Talks</span>
      <span class="tab" data-tab="projects">Projects</span>
      <span class="tab" data-tab="ideas">Ideas</span>
      <!-- The stocks folded away to a few, small, or all of them back. -->
      <button id="stocks-fold" class="fold" type="button" aria-pressed="false"
              title="Fold the stocks away to a few">
        <svg class="grid-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg><span>FOLD</span>
      </button>
    </h2>
    <div class="pane" id="pane-stocks">
      <div id="indices"></div>
      <!-- The interactive-list component, as the feed has it: a bar that
           slides to the row under the pointer and turns its text dark, and
           the stock's chart opening beside the panel. -->
      <div id="watch-area">
        <div id="watch-bar"></div>
        <div id="watchlist"></div>
      </div>
    </div>
    <div class="pane" id="pane-talks" hidden></div>
    <div class="pane" id="pane-projects" hidden></div>
    <div class="pane" id="pane-ideas" hidden></div>
    <!-- One stock, opened out of its card; or the stocks you can add. -->
    <article id="stock" aria-hidden="true"></article>
  </section>

  <section id="headlines" class="panel rise" data-display="feed">
    <h2 id="headlines-head">Headlines</h2>
    <div id="topics" class="chips"></div>
    <!-- The list from the interactive-list component: a bar that slides to
         the row under the pointer and turns its text dark. -->
    <div id="feed">
      <div id="feed-bar"></div>
      <div id="stories"></div>
    </div>
    <!-- One story, opened out of its row. -->
    <article id="story" aria-hidden="true"></article>
  </section>

  <section id="core" data-display="core">
    <canvas id="ring" width="520" height="520"></canvas>
    <!-- The name in lit cells (ledword.js). -->
    <canvas id="wordmark" role="img" aria-label="Apollo"></canvas>
    <div id="hint" class="caption">Hold Ctrl+Alt to talk</div>
    <!-- Only while it is working: the dot matrix and what it is doing. -->
    <div id="thinking"></div>
  </section>

  <section id="answer">
    <div id="you" class="you"></div>
    <div id="reply"></div>
    <div id="visual"></div>
  </section>

  <!-- OSIRIS, laid into the display: its frame, its name along the top and
       the way out. The map is a window of its own laid over the frame
       (osiris.py) - the site will not be drawn inside another page. -->
  <section id="osiris" class="panel" aria-hidden="true" data-display="osiris">
    <header>
      <svg class="eye" viewBox="0 0 26 16" aria-hidden="true"><path d="M1.5 8C5.5 2.2 20.5 2.2 24.5 8 20.5 13.8 5.5 13.8 1.5 8Z"/><circle cx="13" cy="8" r="3.3"/><path d="M10.6 12.8 9.2 15.2M15.3 13.1c1.3 1.5 3.4 2 5.5 1.3"/></svg>
      <b>OSIRIS</b><span>Inside Apollo</span>
      <button id="osiris-close" type="button">Close ✕</button>
    </header>
    <div id="osiris-view">
      <svg class="eye" viewBox="0 0 26 16" aria-hidden="true"><path d="M1.5 8C5.5 2.2 20.5 2.2 24.5 8 20.5 13.8 5.5 13.8 1.5 8Z"/><circle cx="13" cy="8" r="3.3"/><path d="M10.6 12.8 9.2 15.2M15.3 13.1c1.3 1.5 3.4 2 5.5 1.3"/></svg>
      <p>Linking OSIRIS<i class="cursor">_</i></p>
      <p class="too-small">Make this display bigger for the map</p>
    </div>
  </section>

  <!-- Ultra mode's own displays: the side panel's tabs, each a display of
       its own. Their lists move in here while ultra mode is on, and back
       into the side panel after. -->
  <section id="d-projects" class="panel tile-only" data-display="projects"><h2>Projects</h2></section>
  <section id="d-ideas" class="panel tile-only" data-display="ideas"><h2>Ideas</h2></section>
  <section id="d-talks" class="panel tile-only" data-display="talks"><h2>Talks</h2></section>

  <!-- LYLA's health, over the feed, the way a game shows it: her portrait,
       her name, her bar in segments, and what she is doing. -->
  <section id="lyla-block" class="rise">
    <canvas id="lyla-icon" width="48" height="72"></canvas>
    <div id="lyla-hp">
      <div class="hp-head"><b>LYLA</b><span class="hp-tag">HP</span><span id="lyla-pct">88%</span></div>
      <div id="lyla-battery"><div id="lyla-bar"></div></div>
      <div id="lyla-label" class="caption">BOOTING</div>
    </div>
  </section>

  <!-- OSIRIS's eye, under the feed. -->
  <button id="osiris-button" class="hud-button" type="button" aria-pressed="false" title="Open OSIRIS inside Apollo">
    <svg class="eye" viewBox="0 0 26 16" aria-hidden="true"><path d="M1.5 8C5.5 2.2 20.5 2.2 24.5 8 20.5 13.8 5.5 13.8 1.5 8Z"/><circle cx="13" cy="8" r="3.3"/><path d="M10.6 12.8 9.2 15.2M15.3 13.1c1.3 1.5 3.4 2 5.5 1.3"/></svg><span>OSIRIS</span><em>MAP</em>
  </button>
</main>

<!-- The pictures that follow the pointer beside the feed and beside the
     stocks. Outside the panels, so a panel's rounded clip does not cut them
     off. -->
<div id="peek" class="peek" aria-hidden="true"></div>
<div id="chart-peek" class="peek" aria-hidden="true"></div>

<!-- Along the bottom edge: LYLA's room in or out - without it, the panels
     and the ring take the room back - and ultra mode. -->
<nav id="dock">
  <button id="room-toggle" class="hud-button" type="button" aria-pressed="true" title="Show or hide LYLA's room">
    <i class="led"></i><span>LYLA</span><em>ROOM ON</em>
  </button>
  <button id="ultra-button" class="hud-button" type="button" aria-pressed="false"
          title="Ultra mode: every display on the screen, ready for work">
    <svg class="grid-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg><span>ULTRA</span><em>EXPAND</em>
  </button>
</nav>

<!-- Ultra mode's bar along the bottom: back to the normal display, every
     display as a switch, and the grid back when one is expanded. -->
<nav id="ultra-bar" aria-label="Displays">
  <button id="ultra-exit" class="hud-button" type="button" title="Back to the normal display">
    <svg class="grid-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>NORMAL</span>
  </button>
  <div id="ultra-chips"></div>
  <button id="ultra-grid" class="hud-button" type="button" title="Every display back in the grid">
    <svg class="grid-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg><span>GRID</span>
  </button>
  <button id="ultra-reset" class="hud-button" type="button" title="Every display back where it started"><span>RESET</span></button>
</nav>

<!-- One display's settings in ultra mode: its size, and what it shows. -->
<div id="tile-config" role="dialog" aria-hidden="true"></div>

<!-- A line of light down the glass as ultra mode brings its displays up. -->
<div id="ultra-sweep" aria-hidden="true"></div>

<!-- Asleep: ten quiet minutes, and this is all there is. -->
<section id="sleep" aria-hidden="true">
  <div id="sleep-copy">
    <div id="sleep-name"><canvas id="sleep-word" role="img" aria-label="Apollo"></canvas><span id="sleep-tag"></span></div>
    <p id="sleep-fact"></p>
  </div>
  <div id="sleep-wake">Press any key or say anything to wake Apollo</div>
</section>

<!-- As Apollo comes up: an old machine boots on a green tube - its checks
     typed out, the name in lit cells, the prompt - and then the tube
     switches off. A few seconds, once. -->
<section id="intro" aria-hidden="true">
  <div id="intro-screen">
    <pre id="intro-log" class="lit"><span class="text"></span><span class="cursor">_</span></pre>
    <div id="intro-stage"><canvas id="intro-word" role="img" aria-label="Apollo"></canvas></div>
    <div id="intro-ready" class="lit"><span class="text"></span><span class="cursor">_</span></div>
    <div id="intro-foot" class="lit"></div>
  </div>
</section>

<!-- Under this page's own directory on purpose: pywebview roots its HTTP
     server at the page, so anything above it is unreachable at runtime. -->
<script src="vendor/motion.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
