<!doctype html>
<!-- Throwaway: the stock card, in white, before it is drawn natively.
     Delete once ported. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock card — mock</title>
<style>
  @font-face { font-family: "Thmanyah"; font-weight: 400;
               src: url("full/fonts/thmanyahsans-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah"; font-weight: 500;
               src: url("full/fonts/thmanyahsans-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah"; font-weight: 700;
               src: url("full/fonts/thmanyahsans-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Thmanyah"; font-weight: 900;
               src: url("full/fonts/thmanyahsans-Black.woff2") format("woff2"); }

  :root {
    --ink: #0d0f12;
    --muted: #6b7280;
    --hair: rgba(13, 15, 18, .09);
    --up: #0f9d58;
    --up-soft: rgba(15, 157, 88, .16);
    --down: #d1453b;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #e9eaec;
               font-family: "Thmanyah", "Segoe UI", system-ui, sans-serif;
               -webkit-font-smoothing: antialiased;
               display: grid; place-items: center; }

  .card {
    width: 1024px; background: var(--card); border-radius: 26px;
    border: 1px solid var(--hair);
    box-shadow: 0 32px 64px -32px rgba(13, 15, 18, .28);
    overflow: hidden;
  }

  /* --- the head: name, toggle, price, change, period ---------------------- */

  .head { position: relative; padding: 26px 30px 0; }
  .row { display: flex; align-items: center; gap: 14px; }
  .name { font-size: 21px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }

  .toggle { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px;
            background: rgba(13, 15, 18, .05); }
  .toggle button { width: 34px; height: 28px; border: 0; border-radius: 8px;
                   background: transparent; cursor: pointer; color: var(--muted);
                   display: grid; place-items: center;
                   transition: background .18s ease, color .18s ease; }
  .toggle button.on { background: var(--card); color: var(--ink);
                      box-shadow: 0 1px 3px rgba(13, 15, 18, .14); }

  .change { margin-left: auto; display: flex; align-items: center; gap: 22px;
            font-size: 19px; }
  .pct { display: flex; align-items: center; gap: 7px; font-weight: 500; }
  .pct.up { color: var(--up); }
  .pct.down { color: var(--down); }
  .period { display: flex; align-items: center; gap: 9px; color: var(--ink);
            font-weight: 400; }
  .period svg { opacity: .45; }

  .price { margin-top: 10px; font-size: 92px; line-height: 1.02; font-weight: 900;
           letter-spacing: -.035em; color: var(--ink);
           font-variant-numeric: tabular-nums; }

  /* --- the plot ----------------------------------------------------------- */

  .plot { position: relative; height: 340px; margin-top: -58px; }
  .plot .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(13, 15, 18, .10) 1px, transparent 1.2px);
    background-size: 13px 13px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%);
    mask-image: linear-gradient(90deg, transparent 0, #000 22%);
  }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #line { fill: none; stroke: var(--up); stroke-width: 2.6;
          stroke-linecap: round; stroke-linejoin: round; }
  #area { fill: url(#wash); }

  .peak { position: absolute; width: 13px; height: 13px; border-radius: 50%;
          background: var(--up); border: 2.5px solid var(--card);
          box-shadow: 0 0 0 1px var(--up-soft); transform: translate(-50%, -50%); }

  .tip { position: absolute; transform: translate(-102%, 18px);
         background: var(--card); border: 1px solid var(--hair); border-radius: 14px;
         padding: 13px 17px; box-shadow: 0 14px 34px -14px rgba(13, 15, 18, .34);
         white-space: nowrap; }
  .tip b { display: block; font-size: 19px; font-weight: 700; color: var(--ink);
           font-variant-numeric: tabular-nums; }
  .tip span { display: block; margin-top: 3px; font-size: 14px; color: var(--muted); }

  /* --- the foot: the day, and the range ----------------------------------- */

  .foot { display: flex; align-items: center; padding: 17px 30px;
          border-top: 1px solid var(--hair); font-size: 16px; }
  .today { font-weight: 500; }
  .today.up { color: var(--up); }
  .today.down { color: var(--down); }
  .today em { font-style: normal; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .range { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .range b { color: var(--ink); font-weight: 500; }
  .range i { font-style: normal; opacity: .4; margin: 0 9px; }

  /* --- the analysis ------------------------------------------------------- */

  .analysis { display: flex; align-items: stretch;
              border-top: 1px solid var(--hair); background: rgba(13, 15, 18, .022); }
  .cell { flex: 1; padding: 17px 30px; }
  .cell + .cell { border-left: 1px solid var(--hair); }
  .cell .k { font-size: 13px; color: var(--muted); letter-spacing: .04em;
             text-transform: uppercase; }
  .cell .v { margin-top: 5px; font-size: 25px; font-weight: 700; color: var(--ink);
             letter-spacing: -.02em; font-variant-numeric: tabular-nums;
             display: flex; align-items: baseline; gap: 9px; }
  .cell .v small { font-size: 15px; font-weight: 500; }
  .cell .v small.up { color: var(--up); }
  .cell .v small.down { color: var(--down); }
  .cell .n { margin-top: 3px; font-size: 13px; color: var(--muted); }

  /* --- how it arrives ----------------------------------------------------- */

  .rise { opacity: 0; transform: translateY(14px); }
  .card.on .rise { animation: rise .62s cubic-bezier(.215, .61, .355, 1) both; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  #line { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .card.on #line { animation: draw 1.15s cubic-bezier(.32, .72, 0, 1) .12s both; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  #area, .peak, .tip { opacity: 0; }
  .card.on #area { animation: fade .7s ease-out .5s both; }
  .card.on .peak { animation: pop .5s cubic-bezier(.22, 1.4, .36, 1) .95s both; }
  .card.on .tip  { animation: tip .5s cubic-bezier(.215, .61, .355, 1) 1.05s both; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
                   to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes tip { from { opacity: 0; transform: translate(-102%, 30px); }
                   to { opacity: 1; transform: translate(-102%, 18px); } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="head">
    <div class="row">
      <div class="name rise" style="animation-delay:.02s">NVIDIA · NVDA</div>
      <div class="toggle rise" style="animation-delay:.06s">
        <button class="on" title="line">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 11.5 5 7l3 2.5 4.5-6"/><path d="M1.5 14.5h13"/></svg>
        </button>
        <button title="bars">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round">
            <path d="M3 13V8M6.5 13V4M10 13V9.5M13.5 13V6"/><path d="M1.5 14.5h13"/></svg>
        </button>
      </div>
      <div class="change">
        <div class="pct up rise" style="animation-delay:.10s">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 13V3"/><path d="M3.5 7.5 8 3l4.5 4.5"/></svg>
          <span id="pct">1.34%</span>
        </div>
        <div class="period rise" style="animation-delay:.14s">
          <span id="period">Past 30 days</span>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5 8 10.5l4-4"/></svg>
        </div>
      </div>
    </div>
    <div class="price rise" id="price" style="animation-delay:.06s">$222.27</div>
  </div>

  <div class="plot" id="plot">
    <div class="grid"></div>
    <svg id="chart" viewBox="0 0 1024 340" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0f9d58" stop-opacity=".20"/>
          <stop offset="1" stop-color="#0f9d58" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="area"></path>
      <path id="line" pathLength="1"></path>
    </svg>
    <div class="peak" id="peak"></div>
    <div class="tip" id="tip"><b id="tipv">232.40</b><span id="tipd">05 Apr, 2026</span></div>
  </div>

  <div class="foot">
    <div class="today up rise" style="animation-delay:.9s"><span id="today">+2.94</span><em>today</em></div>
    <div class="range rise" style="animation-delay:.95s">
      <b id="hi">232.40</b> peak <i>·</i> <b id="lo">198.10</b> low <i>·</i> <b id="avg">214.80</b> avg
    </div>
  </div>

  <div class="analysis">
    <div class="cell rise" style="animation-delay:1.02s">
      <div class="k">Suggested price</div>
      <div class="v"><span id="target">$327.70</span><small class="up" id="upside">+47.4%</small></div>
      <div class="n" id="who">59 analysts · strong buy</div>
    </div>
    <div class="cell rise" style="animation-delay:1.08s">
      <div class="k">P/E ratio</div>
      <div class="v"><span id="pe">28.10</span><small id="fwd">14.17 forward</small></div>
      <div class="n" id="eps">Earnings $7.91 a share</div>
    </div>
  </div>
</div>

<script>
/* A month of closes, roughly NVDA-shaped, so the curve has something real to
   follow: a run up, a peak, and a drift. */
const SERIES = [198.1, 199.4, 201.8, 200.2, 204.6, 209.3, 207.1, 212.4, 216.8, 214.2,
                219.5, 224.1, 228.9, 232.4, 229.7, 226.3, 221.8, 224.6, 219.1, 215.4,
                217.9, 213.2, 216.7, 220.4, 218.1, 214.9, 219.8, 223.6, 220.1, 222.27];

const W = 1024, H = 340, PAD = 30;

/* A Catmull-Rom spline through the closes, written out as cubic Béziers:
   straight segments between daily closes read as a saw, and the design's line
   is smooth. */
function smooth(points) {
  let d = `M${points[0][0].toFixed(1)},${points[0][1].toFixed(1)}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i], p1 = points[i];
    const p2 = points[i + 1], p3 = points[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} `
       + `${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

const low = Math.min(...SERIES), high = Math.max(...SERIES), span = high - low || 1;
const pts = SERIES.map((v, i) => [
  (i / (SERIES.length - 1)) * W,
  PAD + (1 - (v - low) / span) * (H - PAD * 2),
]);

const line = smooth(pts);
document.getElementById('line').setAttribute('d', line);
document.getElementById('area').setAttribute('d', `${line}L${W},${H}L0,${H}Z`);

const peakAt = SERIES.indexOf(high);
const peak = document.getElementById('peak');
peak.style.left = `${(pts[peakAt][0] / W) * 100}%`;
peak.style.top = `${(pts[peakAt][1] / H) * 100}%`;
const tip = document.getElementById('tip');
tip.style.left = `${(pts[peakAt][0] / W) * 100}%`;
tip.style.top = `${(pts[peakAt][1] / H) * 100}%`;
document.getElementById('tipv').textContent = high.toFixed(2);

/* The price counts up once, the way the design's big number lands. */
function countUp(el, to, prefix = '') {
  const started = performance.now();
  const step = (now) => {
    const at = Math.min(1, (now - started) / 900);
    const eased = 1 - Math.pow(1 - at, 3);
    el.textContent = prefix + (to * eased).toFixed(2);
    if (at < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

requestAnimationFrame(() => {
  document.getElementById('card').classList.add('on');
  countUp(document.getElementById('price'), 222.27, '$');
});
</script>
</body>
</html>
